name: Build Nuvio plugin and Android local service

on:
  push:
    branches: [main, local-cinemana-service]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: local-service
        run: gradle assembleDebug
      - name: Upload service APK
        uses: actions/upload-artifact@v4
        with:
          name: cinemana-local-service-debug
          path: local-service/app/build/outputs/apk/debug/app-debug.apk
